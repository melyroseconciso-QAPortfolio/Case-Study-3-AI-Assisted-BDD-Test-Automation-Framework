# Settings for the framework. Change them here, or override on the command line, e.g.
#   mvn test -Dheadless=false -Dbrowser=firefox
baseUrl=https://www.infor.com
browser=chrome
headless=true
timeoutSeconds=15

# Phase 4 options
# record=true makes a screen video of each test (needs headless=false, see README)
record=false
# stepScreenshots=true attaches a screenshot after every step (evidence trail in the report)
stepScreenshots=false

# Phase 5: API testing (public practice API - these credentials are published in its documentation)
apiBaseUrl=https://restful-booker.herokuapp.com
apiUsername=admin
apiPassword=password123
