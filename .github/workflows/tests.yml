name: Automated tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets you start it manually from the Actions tab

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (quality gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run smoke tests
        run: mvn -B clean test -Dcucumber.filter.tags="@smoke"
      - name: Show failure triage in the run summary
        if: always()
        run: |
          if [ -f target/failure-triage/triage-report.md ]; then
            cat target/failure-triage/triage-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  full:
    name: Full regression (UI, API, mobile)
    needs: smoke            # only runs if the smoke tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run all tests
        run: mvn -B clean test
      - name: Show failure triage in the run summary
        if: always()
        run: |
          if [ -f target/failure-triage/triage-report.md ]; then
            cat target/failure-triage/triage-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build Allure report
        if: always()
        run: mvn -B allure:report
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            target/allure-results
            target/cucumber-reports
            target/failure-triage
            target/site/allure-maven-plugin
      - name: Prepare report for publishing
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  publish-report:
    name: Publish Allure report
    needs: full
    if: always() && github.ref == 'refs/heads/main' && needs.full.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
